<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Exam admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1f3f2;--surf:#fff;--ink:#12201c;--mut:#5c6b66;--ac:#0b6b57;--onac:#fff;--act:#ddefe9;--ln:#d5dbd8;--bad:#b3261e;--ser:"Source Serif 4",Georgia,serif;--sans:"Public Sans",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#0e1513;--surf:#151e1b;--ink:#e7efec;--mut:#93a39d;--ac:#4dc3a5;--onac:#08211b;--act:#18332c;--ln:#27332f;--bad:#f2867f}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans)}
p{margin:0}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{background:var(--surf);border-bottom:1px solid var(--ln)}
.bar>div{max-width:760px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.brand{font:600 1.2rem/1.2 var(--ser)}
main{max-width:760px;margin:auto;padding:30px 20px 110px}
.bar>.wide,main.wide{max-width:1040px}
h2{font:600 1.55rem/1.25 var(--ser);margin:0 0 6px}
.mut{color:var(--mut)}.sm{font-size:.875rem}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin:10px 0}
label{display:block;font-weight:600;font-size:.875rem;margin:20px 0 6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--ln);border-radius:6px;padding:11px 12px}
textarea{min-height:90px}input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:0;border-color:var(--ac)}
.btn{font:600 .95rem var(--sans);background:var(--ac);color:var(--onac);border:0;border-radius:6px;padding:12px 22px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ln)}
.lnk{background:none;border:0;padding:0;color:var(--ac);font:500 .875rem var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px}.lnk.d{color:var(--bad)}
.rows>*{padding:16px 0;border-top:1px solid var(--ln)}.rows>*:last-child{border-bottom:1px solid var(--ln)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{border-left:3px solid var(--ac);background:var(--act);padding:12px 14px;margin-bottom:24px;border-radius:0 6px 6px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:14px 0 28px}
.tiles button{height:40px;border:1px solid var(--ln);background:var(--surf);border-radius:6px;font:500 .85rem var(--sans);color:var(--ink);cursor:pointer}
.tiles .a{background:var(--act);border-color:var(--ac)}.tiles .c{outline:2px solid var(--ink);outline-offset:1px}
.q{font:500 1.35rem/1.5 var(--ser);margin:0 0 22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surf);border:1px solid var(--ln);border-radius:6px;padding:13px 14px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.opt i{flex:none;width:30px;height:30px;border:1.5px solid var(--mut);border-radius:50%;display:grid;place-items:center;font:600 .8rem var(--sans);font-style:normal;color:var(--mut)}
.opt.s{border-color:var(--ac);background:var(--act)}.opt.s i{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--ln)}
.dock>div{max-width:760px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.split{display:grid;grid-template-columns:250px 1fr;gap:40px}@media(max-width:760px){.split{grid-template-columns:1fr;gap:26px}}
.sl button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}
.sl .on{border-left-color:var(--ac);background:var(--act);font-weight:600}
.tabs{display:flex;gap:22px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;font:500 .95rem var(--sans);color:var(--mut);cursor:pointer}.tabs .on{color:var(--ink);border-bottom-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th{font-weight:600;color:var(--mut);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--ln)}td{padding:11px 12px 11px 0;border-bottom:1px solid var(--ln);vertical-align:top}.w{overflow-x:auto}
details{border-top:1px solid var(--ln);padding:16px 0}summary{font-weight:600;cursor:pointer}
.qi small{display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><header class="bar"><div class="wide"><span class="brand">Exam admin</span><nav class="tabs" id="nav"></nav><span id="out"></span></div></header><main class="wide"><div id="v"></div></main><script>
const API_URL="https://script.google.com/macros/s/AKfycbyC6-49hyBwOXNPPcqFkjSgOyiUHlYNw_B4uHjVyKsiQwrcJoP0uJw5q53_wCbsC3-8hA/exec";
const $=i=>document.getElementById(i),L="ABCDEF";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pw=sessionStorage.getItem("pw")||"",D=null,tab="sets",sel="",ren="",vr=null,qf="",sf="";
async function api(action,d){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,password:pw,...d})});const j=await r.json();if(!j.ok)throw new Error(j.error);return j.data}
async function load(){D=await api("adminGetAll");if(!D.sets.find(s=>s.id===sel))sel=D.sets.length?D.sets[0].id:""}
async function act(a,d){try{await api(a,d);await load()}catch(e){alert(e.message)}render()}
async function init(){if(API_URL.startsWith("PASTE")){$("v").innerHTML='<p class="mut">Add your Web App URL to API_URL in this file first.</p>';return}
 if(pw){try{await load()}catch(e){pw=""}}render()}
async function login(){pw=$("pw").value;try{await load();sessionStorage.setItem("pw",pw);render()}catch(e){pw="";$("er").textContent=e.message}}
function logout(){sessionStorage.removeItem("pw");pw="";D=null;render()}
const sname=id=>(D.sets.find(s=>s.id===String(id))||{}).title||"(deleted set)";
function render(){
 const v=$("v"),n=$("nav"),o=$("out");
 if(!D){n.innerHTML="";o.innerHTML="";return v.innerHTML=`<div style="max-width:380px"><h2>Admin sign in</h2><p class="mut">Enter the admin password to manage exams.</p><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><p class="err" id="er"></p><button class="btn" onclick="login()">Sign in</button></div>`}
 n.innerHTML=[["sets","Question sets"],["res","Results"],["set","Settings"]].map(([k,t])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';vr=null;render()">${t}</button>`).join("");
 o.innerHTML=`<button class="lnk" onclick="act('adminGetAll',{})">Refresh</button> &nbsp; <button class="lnk" onclick="logout()">Sign out</button>`;
 v.innerHTML=tab==="sets"?setsView():tab==="res"?resView():`<h2>Settings</h2><label for="tt">Exam title</label><input id="tt" value="${esc(D.title)}" style="max-width:420px"><p style="margin-top:16px"><button class="btn" onclick="act('setTitle',{title:$('tt').value})">Save title</button></p>`;
}
function setsView(){
 const qs=s=>D.questions.filter(q=>q.setId===s),cur=D.sets.find(s=>s.id===sel);
 const left=`<div><h2 style="font-size:1.1rem">Sets</h2><div class="sl" style="margin:10px 0 16px">${D.sets.map(s=>`<button class="${s.id===sel?"on":""}" onclick="sel='${s.id}';ren='';render()">${esc(s.title)} <span class="mut sm">(${qs(s.id).length})</span></button>`).join("")||'<p class="mut sm">No sets yet.</p>'}</div><input id="sn" placeholder="New set name" aria-label="New set name"><p style="margin-top:10px"><button class="btn ghost" onclick="newSet()">Add set</button></p></div>`;
 if(!cur)return `<div class="split">${left}<p class="mut">Create your first set to start adding questions.</p></div>`;
 const head=ren===cur.id?`<div class="row"><input id="rn" value="${esc(cur.title)}"><span style="white-space:nowrap"><button class="lnk" onclick="act('renameSet',{id:'${cur.id}',title:$('rn').value});ren=''">Save</button> &nbsp; <button class="lnk" onclick="ren='';render()">Cancel</button></span></div>`:`<div class="row"><h2>${esc(cur.title)}</h2><span style="white-space:nowrap"><button class="lnk" onclick="ren='${cur.id}';render()">Rename</button> &nbsp; <button class="lnk d" onclick="delSet('${cur.id}')">Delete set</button></span></div>`;
 const list=qs(cur.id).length?`<div class="rows" style="margin:12px 0 24px">${qs(cur.id).map((q,i)=>`<div class="row" style="align-items:flex-start"><div><b>${i+1}. ${esc(q.q)}</b><span class="mut sm qi"><small>${q.o.map((t,k)=>L[k]+". "+esc(t)).join(" &nbsp; ")}</small></span></div><button class="lnk d" onclick="delQ('${q.id}')">Delete</button></div>`).join("")}</div>`:'<p class="mut" style="margin:12px 0 24px">No questions in this set yet.</p>';
 return `<div class="split">${left}<div>${head}<p class="mut sm">${qs(cur.id).length} questions</p>${list}<details open><summary>Add a question</summary><label for="q">Question</label><textarea id="q"></textarea><label>Options (2 to 4)</label>${[0,1,2,3].map(i=>`<input id="o${i}" placeholder="Option ${L[i]}" aria-label="Option ${L[i]}" style="margin-bottom:8px">`).join("")}<p style="margin-top:6px"><button class="btn" onclick="addQ()">Add question</button></p></details><details><summary>Paste many questions</summary><p class="mut sm" style="margin-top:8px">Leave a blank line between questions. Put each option on its own line, starting with A), B), C) or D).</p><textarea id="bulk" style="min-height:150px;margin-top:10px"></textarea><p style="margin-top:6px"><button class="btn" onclick="bulk()">Import questions</button></p></details></div></div>`;
}
function newSet(){const t=$("sn").value.trim();if(t)act("addSet",{title:t})}
function addQ(){const q=$("q").value.trim(),o=[0,1,2,3].map(i=>$("o"+i).value.trim()).filter(Boolean);if(!q||o.length<2)return alert("Enter a question and at least two options.");act("addQuestions",{setId:sel,items:[{q,o}]})}
function parse(t){return t.split(/\n\s*\n/).map(b=>{let q="",o=[];b.split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{const m=l.match(/^\(?([A-F])[\).:]\s*(.+)/i);if(m&&L.indexOf(m[1].toUpperCase())===o.length)o.push(m[2]);else if(!o.length)q+=(q?" ":"")+l.replace(/^(?:q(?:uestion)?\s*)?\d*\s*[\.\):\-]\s*/i,"")});return{q,o}}).filter(x=>x.q&&x.o.length>=2)}
function bulk(){const it=parse($("bulk").value);if(!it.length)return alert("No valid questions found. Put each option on its own line starting with A), B), C) or D).");act("addQuestions",{setId:sel,items:it})}
function delSet(id){if(confirm("Delete this set and all its questions?"))act("deleteSet",{id})}
function delQ(id){if(confirm("Delete this question?"))act("deleteQuestion",{id})}
function retake(key,setId){if(confirm("Clear this result and allow another attempt at this set?"))act("allowRetake",{key,setId})}
function resView(){
 return `<div class="row" style="margin-bottom:18px"><h2>Results</h2><button class="btn ghost" onclick="csv()">Download CSV</button></div><div class="g2" style="max-width:520px;margin-bottom:20px"><input value="${esc(qf)}" placeholder="Search by name" oninput="qf=this.value;$('tb').innerHTML=tbl()" aria-label="Search by name"><select onchange="sf=this.value;$('tb').innerHTML=tbl()" aria-label="Filter by set"><option value="">All sets</option>${D.sets.map(s=>`<option value="${s.id}" ${sf===s.id?"selected":""}>${esc(s.title)}</option>`).join("")}</select></div>${vr?ansCard():""}<div id="tb">${tbl()}</div>`;
}
function tbl(){
 const rows=[];D.participants.forEach(p=>{const rs=D.responses.filter(r=>r.key===p.key);if(rs.length)rs.forEach(r=>rows.push({p,r}));else rows.push({p,r:null})});
 const f=rows.filter(({p,r})=>(!qf||String(p.name).toLowerCase().includes(qf.toLowerCase()))&&(!sf||(r&&r.setId===sf)));
 if(!f.length)return '<p class="mut">No matching results.</p>';
 return `<p class="mut sm" style="margin-bottom:8px">${D.participants.length} students, ${D.responses.length} submissions</p><div class="w"><table><tr><th>Name</th><th>Age</th><th>Branch</th><th>Set</th><th>Submitted</th><th></th></tr>${f.map(({p,r})=>`<tr><td>${esc(p.name)}</td><td>${esc(p.age)}</td><td>${esc(p.branch)}</td><td>${r?esc(sname(r.setId)):'<span class="mut">Not attempted</span>'}</td><td>${r?new Date(r.submitted).toLocaleString():""}</td><td style="white-space:nowrap">${r?`<button class="lnk" onclick="vr={key:'${r.key}',setId:'${r.setId}'};render()">View answers</button> &nbsp; <button class="lnk d" onclick="retake('${r.key}','${r.setId}')">Allow retake</button>`:`<button class="lnk d" onclick="act('removeParticipant',{key:'${p.key}'})">Remove</button>`}</td></tr>`).join("")}</table></div>`;
}
function ansCard(){const r=D.responses.find(x=>x.key===vr.key&&x.setId===vr.setId);if(!r)return"";const p=D.participants.find(x=>x.key===r.key)||{};
 return `<div class="note"><div class="row"><b>${esc(p.name||"")}, ${esc(sname(r.setId))}</b><button class="lnk" onclick="vr=null;render()">Close</button></div>${D.questions.filter(q=>q.setId===r.setId).map((q,i)=>{const c=r.answers[q.id];return `<p style="margin-top:10px"><b>${i+1}. ${esc(q.q)}</b><br><span class="mut">${c==null?"Not answered":esc(L[c]+". "+(q.o[c]||""))}</span></p>`}).join("")}</div>`}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=[["Name","Age","Branch","Set","Question no","Question","Answer","Submitted"]];
 D.participants.forEach(p=>{const rs=D.responses.filter(r=>r.key===p.key);if(!rs.length)rows.push([p.name,p.age,p.branch,"","","","",""]);rs.forEach(r=>D.questions.filter(x=>x.setId===r.setId).forEach((x,i)=>{const c=r.answers[x.id];rows.push([p.name,p.age,p.branch,sname(r.setId),i+1,x.q,c==null?"":L[c]+") "+x.o[c],new Date(r.submitted).toISOString()])}))});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="results.csv";a.click()}
init();
</script></body></html>
